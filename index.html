    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1329;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;

        .loader-card {
            text-align: center;
            padding: 2.5rem;

            filter: drop-shadow(0 0 20px rgba(0, 163, 255, 0.7));
            display: block;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 163, 255, 0.2);
            border-top-color: #00a3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        h2 {
            margin: 0 0 0.5rem;

            color: #ffffff;
        }

        p {
            margin: 0;
            font-size: 0.875rem;
